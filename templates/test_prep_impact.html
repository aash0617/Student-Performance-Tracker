<!DOCTYPE html>
<html>

<head>

    <title>Test Preparation Analysis</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
          body {
            background-image: url("{{ url_for('static', filename='plain.png') }}");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container { margin: 40px auto; width: 85%; padding: 20px; background: white; border-radius: 10px; }
        h2 { color: #0d6efd; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #ccc; }
        .btn { margin-top: 20px; background: #198754; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📚 Test Preparation Impact</h2>
        {{ chart_div | safe }}
        <br><br>
        {{ prep_table | safe }}
        <a href="/dashboard" class="btn">Back to Dashboard</a>
    </div>
</body>
</html>
