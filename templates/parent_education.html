<!DOCTYPE html>
<html>
<head>
    <title>Parental Education Impact</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            background-image: url("{{ url_for('static', filename='plain.png') }}");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h2 {
            margin-top: 40px;
            color: #222;
            font-size: 28px;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
        }

        .table {
            width: 85%;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            overflow: hidden;
        }

        .table th, .table td {
            padding: 12px;
            border: 1px solid #ddd;
        }

        .table th {
            background-color: #6c757d;
            color: white;
        }

        .btn-back {
            margin: 30px 0;
            background-color: #343a40;
            color: white;
            padding: 10px 25px;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.3s ease;
        }

        .btn-back:hover {
            background-color: #495057;
        }

        @media (max-width: 768px) {
            .table {
                width: 95%;
                font-size: 14px;
            }

            h2 {
                font-size: 22px;
            }

            .btn-back {
                padding: 8px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <h2>🎓 Parental Education vs Student Performance</h2>

    <div>
        {{ edu_table | safe }}
    </div>

    <div>
        {{ chart_div | safe }}
    </div>

    <br>
    <a href="/dashboard" class="btn-back">Back to Dashboard</a>
</body>
</html>
