<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Performance Tracker</title>
  <style>
    body {
      background-image: url("{{ url_for('static', filename='back.png') }}");
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column; /* Important for vertical layout */
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      color: #343a40;
    }

    .nav-buttons {
      margin-top: 30px;
    }

    .btn {
      display: inline-block;
      margin: 10px;
      padding: 12px 25px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div><h1><u>🎓 Welcome to Student Performance Tracker</u></h1></div>
  <div class="nav-buttons">
    <a href="/login" class="btn">Login</a>
  </div>
</body>
</html>
